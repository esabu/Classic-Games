<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b2d33">
<title>Classic Games</title>
<style>
  :root {
    --bg: #2b2d33;
    --shell-1: #e7e2d6;
    --shell-2: #d4cebf;
    --shell-3: #c3bcab;
    --ink: #3a3d48;
    --red: #b23a3a;
    --lcd: #9eab84;
    --pixel: #141a0e;
    --dim: rgba(20, 26, 14, 0.38);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .shell {
    width: 100%;
    max-width: 440px;
    margin: auto;
    padding: 22px 18px 20px;
    background: linear-gradient(160deg, var(--shell-1) 0%, var(--shell-2) 55%, var(--shell-3) 100%);
    border-radius: 28px 28px 64px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -6px 18px rgba(0,0,0,.18);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 0 6px 14px;
  }
  h1 {
    font-size: clamp(16px, 4.6vw, 20px);
    letter-spacing: .14em;
    font-weight: 800;
  }
  header p {
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--red);
    font-weight: 800;
    white-space: nowrap;
  }
  .bezel {
    background: linear-gradient(180deg, #4b4f5c, #383b45);
    border-radius: 14px 14px 36px 14px;
    padding: 14px 14px 10px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.7);
  }
  .lcd {
    background: var(--lcd);
    color: var(--pixel);
    border-radius: 4px;
    padding: 16px 14px 14px;
    box-shadow: inset 0 0 8px rgba(0,0,0,.4);
    background-image: linear-gradient(rgba(255,255,255,.10), rgba(0,0,0,.06));
  }
  .lcd h2 {
    font-size: 12px;
    letter-spacing: .32em;
    font-weight: 800;
    margin-bottom: 12px;
  }
  .games { list-style: none; display: grid; gap: 10px; }
  a.play {
    display: block;
    text-decoration: none;
    color: var(--pixel);
    border: 3px solid var(--pixel);
    border-radius: 8px;
    padding: 18px 12px 16px;
    text-align: center;
    background: rgba(255,255,255,.08);
    min-height: 88px;
  }
  a.play:focus-visible {
    outline: 3px solid #e2574c;
    outline-offset: 3px;
  }
  a.play:active { transform: translateY(2px); }
  a.play strong {
    display: block;
    font-size: clamp(20px, 6vw, 26px);
    letter-spacing: .16em;
    font-weight: 800;
  }
  a.play span {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: .06em;
    font-weight: 700;
    line-height: 1.4;
  }
  .slot {
    border: 2px dashed var(--dim);
    border-radius: 8px;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    letter-spacing: .18em;
    font-size: 12px;
    font-weight: 800;
    color: var(--dim);
    padding: 16px;
  }
  .label {
    color: #c9ccd6;
    font-size: 10px;
    letter-spacing: .28em;
    text-align: center;
    padding-top: 8px;
    font-weight: 700;
  }
  .label b { color: #e2574c; }
</style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>CLASSIC GAMES</h1>
      <p>LCD</p>
    </header>
    <div class="bezel">
      <div class="lcd">
        <h2>SELECT</h2>
        <ul class="games">
          <li>
            <a class="play" href="brick-game/">
              <strong>BRICK GAME</strong>
              <span>SNAKE · RACE · TETRIS · SHOOT · TANKS</span>
            </a>
          </li>
          <li class="slot" aria-hidden="true">MORE GAMES</li>
        </ul>
      </div>
      <p class="label">&#9632; <b>1</b> GAME READY &#9632;</p>
    </div>
  </main>
</body>
</html>
